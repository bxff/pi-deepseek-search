[project]
name = "prime-agent-skill-deepseek-search"
version = "0.2.0"
description = "DeepSeek Search and Fetch skill for Prime Agent."
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.scripts]
deepseek_search = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_search"]
